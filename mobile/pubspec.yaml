name: autoschool_mobile
description: Мобильное приложение для учащихся и инструкторов автошкол ДОСААФ.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.7.0                      # HTTP-клиент для REST API
  flutter_secure_storage: ^9.2.2   # токены в Keychain / Android Keystore (ТЗ 3.2.3.6)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true                   # локализация из lib/l10n (ТЗ 3.2.4.1)
